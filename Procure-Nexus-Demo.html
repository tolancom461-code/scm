&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;procure-nexus-demo&#x27;);
const pages={overview:&#x27;لوحة المشروع&#x27;,projects:&#x27;المشاريع والميزانية&#x27;,orders:&#x27;أوامر الشراء والعقود&#x27;,receiving:&#x27;الاستلام والإنجاز&#x27;,finance:&#x27;الفواتير والدفعات&#x27;,suppliers:&#x27;الموردون&#x27;};
const roles={buyer:&#x27;مسؤول المشتريات&#x27;,receiver:&#x27;مسؤول الاستلام&#x27;,approver:&#x27;المعتمد&#x27;};
const labels={draft:&#x27;مسودة&#x27;,pending:&#x27;بانتظار الاعتماد&#x27;,approved:&#x27;معتمد&#x27;,posted:&#x27;مدفوع&#x27;,blocked:&#x27;غير مطابق&#x27;,cancelled:&#x27;ملغى&#x27;};
const fmt=new Intl.NumberFormat(&#x27;en-US&#x27;,{maximumFractionDigits:2});
const number=n=&gt;fmt.format(n);
const money=n=&gt;&#x27;&lt;bdi class=&quot;pn-number&quot;&gt;&#x27;+number(n)+&#x27;&lt;/bdi&gt; ريال&#x27;;
const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const defaultState=()=&gt;({v:1,view:&#x27;overview&#x27;,role:&#x27;buyer&#x27;,budget:300000,phaseProgress:[100,50],suppliers:[{id:1,name:&#x27;مشتل الزيتون&#x27;},{id:2,name:&#x27;مؤسسة تجهيز الفروع&#x27;}],orders:[{id:1,title:&#x27;توريد 20 شجرة زيتون&#x27;,type:&#x27;goods&#x27;,supplier:1,qty:20,price:10000,accepted:20,status:&#x27;approved&#x27;,creator:&#x27;buyer&#x27;},{id:2,title:&#x27;أعمال تجهيز الفرع&#x27;,type:&#x27;works&#x27;,supplier:2,qty:100,price:1000,accepted:50,status:&#x27;approved&#x27;,creator:&#x27;buyer&#x27;}],invoices:[{id:1,order:1,reference:&#x27;OLIVE-200&#x27;,qty:20,price:10000,status:&#x27;approved&#x27;,creator:&#x27;buyer&#x27;},{id:2,order:2,reference:&#x27;WORK-50&#x27;,qty:50,price:1000,status:&#x27;approved&#x27;,creator:&#x27;buyer&#x27;}],payments:[{id:1,order:1,invoice:1,milestone:1,amount:60000,status:&#x27;posted&#x27;,creator:&#x27;buyer&#x27;,reference:&#x27;سند الدفعة الأولى&#x27;},{id:2,order:2,invoice:2,milestone:1,amount:50000,status:&#x27;pending&#x27;,creator:&#x27;buyer&#x27;,reference:&#x27;مستخلص أعمال 50%&#x27;}],receipts:[{id:1,order:1,qty:20,rejected:0,status:&#x27;approved&#x27;,creator:&#x27;receiver&#x27;,evidence:&#x27;محضر استلام الأشجار&#x27;},{id:2,order:2,qty:50,rejected:0,status:&#x27;approved&#x27;,creator:&#x27;receiver&#x27;,evidence:&#x27;محضر إنجاز نصف الأعمال&#x27;}],planting:false,tab:&#x27;payments&#x27;,audit:[]});
let state=defaultState(),notice=null,form=null;
function restore(snapshot){if(!snapshot||snapshot.v!==1||!pages[snapshot.view]||!roles[snapshot.role]||!Number.isFinite(snapshot.budget)||![&#x27;suppliers&#x27;,&#x27;orders&#x27;,&#x27;invoices&#x27;,&#x27;payments&#x27;,&#x27;receipts&#x27;,&#x27;audit&#x27;,&#x27;phaseProgress&#x27;].every(k=&gt;Array.isArray(snapshot[k])))return;state=structuredClone(snapshot);}
restore(window.openai?.widgetState?.privateContent);
const order=id=&gt;state.orders.find(o=&gt;o.id===Number(id));
const total=o=&gt;Math.round(o.qty*o.price*100)/100;
const invoiceTotal=i=&gt;Math.round(i.qty*i.price*100)/100;
const paidForInvoice=id=&gt;state.payments.filter(p=&gt;p.invoice===id&amp;&amp;p.status===&#x27;posted&#x27;).reduce((n,p)=&gt;n+p.amount,0);
const pendingForInvoice=id=&gt;state.payments.filter(p=&gt;p.invoice===id&amp;&amp;p.status===&#x27;pending&#x27;).reduce((n,p)=&gt;n+p.amount,0);
const due=i=&gt;Math.max(0,invoiceTotal(i)-paidForInvoice(i.id)-pendingForInvoice(i.id));
const consumed=(id,exclude)=&gt;state.invoices.filter(i=&gt;i.order===id&amp;&amp;i.id!==exclude&amp;&amp;[&#x27;approved&#x27;,&#x27;pending&#x27;].includes(i.status)).reduce((n,i)=&gt;n+i.qty,0);
const metrics=()=&gt;({committed:state.orders.filter(o=&gt;o.status===&#x27;approved&#x27;).reduce((n,o)=&gt;n+total(o),0),accepted:state.orders.reduce((n,o)=&gt;n+o.accepted*o.price,0),actual:state.invoices.filter(i=&gt;i.status===&#x27;approved&#x27;).reduce((n,i)=&gt;n+invoiceTotal(i),0),paid:state.payments.filter(p=&gt;p.status===&#x27;posted&#x27;).reduce((n,p)=&gt;n+p.amount,0)});
const nextId=list=&gt;Math.max(0,...list.map(x=&gt;x.id))+1;
const status=s=&gt;&#x27;&lt;span class=&quot;pn-status &#x27;+([&#x27;approved&#x27;,&#x27;posted&#x27;].includes(s)?&#x27;pn-good&#x27;:s===&#x27;pending&#x27;?&#x27;pn-pending&#x27;:s===&#x27;blocked&#x27;?&#x27;pn-danger&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+labels[s]+&#x27;&lt;/span&gt;&#x27;;
const btn=(label,action,id,primary=false)=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;pn-btn cursor-interaction&#x27;+(primary?&#x27; pn-primary&#x27;:&#x27;&#x27;)+&#x27;&quot; data-action=&quot;&#x27;+action+&#x27;&quot;&#x27;+(id!=null?&#x27; data-id=&quot;&#x27;+id+&#x27;&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+label+&#x27;&lt;/button&gt;&#x27;;
const options=(list,label)=&gt;list.map(o=&gt;&#x27;&lt;option value=&quot;&#x27;+o.id+&#x27;&quot;&gt;&#x27;+esc(label(o))+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;);
const sourceOptions=()=&gt;options(state.orders.filter(o=&gt;o.status===&#x27;approved&#x27;),o=&gt;o.title);
function schedule(o){if(o.id===1)return[{id:1,name:&#x27;الدفعة الأولى · 30%&#x27;,amount:60000,eligible:true},{id:2,name:&#x27;بعد الاستلام · 40%&#x27;,amount:80000,eligible:o.accepted===o.qty},{id:3,name:&#x27;بعد الزراعة · 30%&#x27;,amount:60000,eligible:state.planting}];return[{id:1,name:&#x27;مستخلصات الأعمال / التوريد&#x27;,amount:total(o),eligible:true}];}
function availableMilestones(o){return schedule(o).map(m=&gt;({...m,available:m.amount-state.payments.filter(p=&gt;p.order===o.id&amp;&amp;p.milestone===m.id&amp;&amp;[&#x27;posted&#x27;,&#x27;pending&#x27;].includes(p.status)).reduce((n,p)=&gt;n+p.amount,0)})).filter(m=&gt;m.available&gt;0);}
function log(text){state.audit.unshift({text,time:new Intl.DateTimeFormat(&#x27;ar-SA&#x27;,{hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;,timeZone:&#x27;Asia/Riyadh&#x27;}).format(new Date())});state.audit=state.audit.slice(0,6);}
function save(){const m=metrics();window.openai?.setWidgetState?.({modelContent:{program:&#x27;Procure Nexus&#x27;,view:pages[state.view],role:roles[state.role],budget:state.budget,committed:m.committed,actual:m.actual,paid:m.paid,acceptedTrees:order(1).accepted},privateContent:state})?.catch?.(()=&gt;{});}
function succeed(text){notice={text,error:false};log(text);form=null;save();render();}
function fail(text){notice={text,error:true};render();}
function heading(title,secondary,action){return &#x27;&lt;div class=&quot;pn-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+title+&#x27;&lt;/h1&gt;&#x27;+(secondary?&#x27;&lt;p class=&quot;pn-muted&quot;&gt;&#x27;+secondary+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;+(action||&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}

function orderTable(compact=false){return &#x27;&lt;div class=&quot;pn-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;الأمر / العقد&lt;/th&gt;&lt;th&gt;القيمة&lt;/th&gt;&lt;th&gt;المقبول&lt;/th&gt;&lt;th&gt;الحالة&lt;/th&gt;&lt;th&gt;الإجراء&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+state.orders.map(o=&gt;&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+esc(o.title)+&#x27;&lt;small&gt;&#x27;+esc(state.suppliers.find(s=&gt;s.id===o.supplier)?.name||&#x27;&#x27;)+&#x27;&lt;/small&gt;&lt;/td&gt;&lt;td&gt;&#x27;+money(total(o))+&#x27;&lt;/td&gt;&lt;td&gt;&lt;bdi&gt;&#x27;+number(o.accepted)+&#x27; / &#x27;+number(o.qty)+&#x27;&lt;/bdi&gt;&lt;/td&gt;&lt;td&gt;&#x27;+status(o.status)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(o.status===&#x27;draft&#x27;?btn(&#x27;إرسال&#x27;,&#x27;submitOrder&#x27;,o.id):o.status===&#x27;pending&#x27;?btn(&#x27;اعتماد&#x27;,&#x27;approveOrder&#x27;,o.id):btn(compact?&#x27;الدفعات&#x27;:&#x27;المتابعة&#x27;,&#x27;openFinance&#x27;,o.id))+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&#x27;;}
function overview(){const m=metrics(),pending=state.payments.filter(p=&gt;p.status===&#x27;pending&#x27;).length;return heading(&#x27;إنشاء وتجهيز فرع الرياض&#x27;,&#x27;توسعة الفروع · قيد التنفيذ&#x27;,btn(&#x27;متابعة الدفعات&#x27;+(pending?&#x27; · &#x27;+pending+&#x27; معلقة&#x27;:&#x27;&#x27;),&#x27;navigate&#x27;,&#x27;finance&#x27;,true))+summary()+&#x27;&lt;section class=&quot;pn-panel pn-dashboard-phases&quot;&gt;&lt;div class=&quot;pn-row&quot;&gt;&lt;h2&gt;مراحل المشروع&lt;/h2&gt;&lt;span class=&quot;pn-muted&quot;&gt;المتاح للالتزام &#x27;+money(state.budget-m.committed)+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+[&#x27;التشجير وتنسيق الموقع&#x27;,&#x27;تجهيز الفرع&#x27;].map((name,index)=&gt;&#x27;&lt;div class=&quot;pn-phase&quot;&gt;&lt;div class=&quot;pn-row&quot;&gt;&lt;span&gt;&#x27;+name+&#x27;&lt;/span&gt;&lt;bdi&gt;&#x27;+state.phaseProgress[index]+&#x27;%&lt;/bdi&gt;&lt;/div&gt;&lt;div class=&quot;pn-track&quot; role=&quot;progressbar&quot; aria-label=&quot;&#x27;+name+&#x27;&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;&#x27;+state.phaseProgress[index]+&#x27;&quot;&gt;&lt;span style=&quot;width:&#x27;+state.phaseProgress[index]+&#x27;%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/section&gt;&lt;div class=&quot;pn-mobile-orders&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;pn-btn cursor-interaction&quot; data-action=&quot;navigate&quot; data-id=&quot;orders&quot;&gt;عرض التوريد والأعمال&lt;/button&gt;&lt;/div&gt;&lt;section class=&quot;pn-panel pn-dashboard-orders&quot;&gt;&lt;h2&gt;التوريد والأعمال&lt;/h2&gt;&#x27;+orderTable(true)+&#x27;&lt;/section&gt;&#x27;+(state.audit.length?&#x27;&lt;section class=&quot;pn-panel pn-dashboard-audit&quot;&gt;&lt;h2&gt;آخر الإجراءات&lt;/h2&gt;&#x27;+state.audit.slice(0,3).map(a=&gt;&#x27;&lt;div class=&quot;pn-row pn-log&quot;&gt;&lt;span&gt;&#x27;+esc(a.text)+&#x27;&lt;/span&gt;&lt;span class=&quot;pn-muted&quot;&gt;&#x27;+a function receiving(){return heading(&#x27;الاستلام وإثبات الإنجاز&#x27;,&#x27;المواد تُفحص، والأعمال تُثبت بمحضر إنجاز&#x27;)+&#x27;&lt;section class=&quot;pn-panel&quot;&gt;&lt;form class=&quot;pn-form&quot; data-form=&quot;receipt&quot;&gt;&lt;label&gt;أمر المواد / عقد الأعمال&lt;select name=&quot;order&quot; aria-label=&quot;أمر المواد / عقد الأعمال&quot;&gt;&#x27;+sourceOptions()+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;الكمية / وحدات الإنجاز&lt;input name=&quot;qty&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;1&quot; required&gt;&lt;/label&gt;&lt;label&gt;الكمية المرفوضة للمواد&lt;input name=&quot;rejected&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;0&quot; required&gt;&lt;/label&gt;&lt;label&gt;مرجع المحضر / الفحص&lt;input name=&quot;evidence&quot; minlength=&quot;3&quot; maxlength=&quot;100&quot; required placeholder=&quot;مرجع محضر الاستلام أو الإنجاز&quot;&gt;&lt;/label&gt;&lt;div class=&quot;pn-wide&quot;&gt;&lt;button type=&quot;button&quot; data-submit=&quot;true&quot; class=&quot;pn-btn pn-primary cursor-interaction&quot;&gt;تسجيل الاستلام / المحضر&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;&lt;section class=&quot;pn-panel&quot;&gt;&lt;h2&gt;المحاضر المسجلة&lt;/h2&gt;&lt;div class=&quot;pn-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;البند&lt;/th&gt;&lt;th&gt;الكمية&lt;/th&gt;&lt;th&gt;الحالة&lt;/th&gt;&lt;th&gt;الإثبات&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+state.receipts.map(r=&gt;&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+esc(order(r.order).title)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+r.qty+(r.rejected?&#x27;&lt;small&gt;المرفوض &#x27;+r.rejected+&#x27;&lt;/small&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+status(r.status)+(r.status===&#x27;pending&#x27;?&#x27;&lt;div&gt;&#x27;+btn(&#x27;اعتماد الإنجاز&#x27;,&#x27;approveReceipt&#x27;,r.id)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+esc(r.evidence) function invoiceForm(){return &#x27;&lt;section class=&quot;pn-panel&quot;&gt;&lt;h2&gt;فاتورة مورد&lt;/h2&gt;&lt;form class=&quot;pn-form&quot; data-form=&quot;invoice&quot;&gt;&lt;label&gt;الأمر / العقد&lt;select name=&quot;order&quot; aria-label=&quot;الأمر / العقد&quot; data-order-price=&quot;true&quot;&gt;&#x27;+sourceOptions()+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;مرجع فاتورة المورد&lt;input name=&quot;reference&quot; maxlength=&quot;80&quot; minlength=&quot;3&quot; required placeholder=&quot;رقم فاتورة المورد&quot;&gt;&lt;/label&gt;&lt;label&gt;الكمية المفوترة&lt;input name=&quot;qty&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;1&quot; required&gt;&lt;/label&gt;&lt;label&gt;سعر الوحدة (ريال)&lt;input name=&quot;price&quot; type=&quot;number&quot; min=&quot;.01&quot; step=&quot;.01&quot; value=&quot;&#x27;+order(state.orders.find(o=&gt;o.status===&#x27;approved&#x27;).id).price+&#x27;&quot; required&gt;&lt;/label&gt;&lt;div class=&quot;pn-wide pn-actions&quot;&gt;&lt;button type=&quot;button&quot; data-submit=&quot;true&quot; class=&quot;pn-btn pn-primary cursor-interaction&quot;&gt;حفظ الفاتورة&lt;/button&gt;&#x27;+btn(&#x27;إلغاء&#x27;,&#x27;hideForm&#x27;)+&#x27;&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;&#x27;;}
function paymentForm(){const invoices=state.invoices.filter(i=&gt;i.status===&#x27;approved&#x27;&amp;&amp;due(i)&gt;0);if(!invoices.length)return &#x27;&lt;section class=&quot;pn-panel&quot;&gt;&lt;p&gt;لا توجد فاتورة معتمدة برصيد متاح لطلب الدفع.&lt;/p&gt;&#x27;+btn(&#x27;إغلاق&#x27;,&#x27;hideForm&#x27;)+&#x27;&lt;/section&gt;&#x27;;const first=invoices[0],o=order(first.order),milestones=availableMilestones(o);return &#x27;&lt;section class=&quot;pn-panel&quot;&gt;&lt;h2&gt;طلب دفعة&lt;/h2&gt;&lt;form class=&quot;pn-form&quot; data-form=&quot;payment&quot;&gt;&lt;label&gt;الفاتورة&lt;select name=&quot;invoice&quot; aria-label=&quot;الفاتورة&quot; data-payment-invoice=&quot;true&quot;&gt;&#x27;+options(invoices,i=&gt;i.reference+&#x27; — متاح &#x27;+number(due(i))+&#x27; ريال&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;مرحلة الدفع&lt;select name=&quot;milestone&quot; aria-label=&quot;مرحلة الدفع&quot;&gt;&#x27;+options(milestones,m=&gt;m.name)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;المبلغ (ريال)&lt;input name=&quot;amount&quot; type=&quot;number&quot; min=&quot;.01&quot; step=&quot;.01&quot; value=&quot;&#x27;+Math.min(due(first),milestones[0]?.available||0)+&#x27;&quot; required&gt;&lt;/label&gt;&lt;label&gt;مرجع الدفع&lt;input name=&quot;reference&quot; maxlength=&quot;80&quot; minlength=&quot;3&quot; required placeholder=&quot;مرجع التحويل / طلب الدفع&quot;&gt;&lt;/label&gt;&lt;div class=&quot;pn-wide pn-actions&quot;&gt;&lt;button type=&quot;button&quot; data-submit=&quot;true&quot; class=&quot;pn-btn pn-primary cursor-interaction&quot;&gt;إرسال للاعتماد&lt;/button&gt;&#x27;+btn(&#x27;إلغاء&#x27;,&#x27;hideForm&#x27;)+&#x27;&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;&#x27;;}
function finance(){const selectedOrder=order(1),milestones=schedule(selectedOrder);return heading(&#x27;الفواتير والدفعات&#x27;,&#x27;توريد كامل، وسداد على مراحل&#x27;,btn(state.tab===&#x27;invoices&#x27;?&#x27;إنشاء فاتورة&#x27;:&#x27;طلب دفعة&#x27;,&#x27;showForm&#x27;,state.tab===&#x27;invoices&#x27;?&#x27;invoice&#x27;:&#x27;payment&#x27;,true))+&#x27;&lt;div class=&quot;pn-actions&quot;&gt;&#x27;+btn(&#x27;الدفعات&#x27;,&#x27;financeTab&#x27;,&#x27;payments&#x27;,state.tab===&#x27;payments&#x27;)+btn(&#x27;الفواتير&#x27;,&#x27;financeTab&#x27;,&#x27;invoices&#x27;,state.tab===&#x27;invoices&#x27;)+&#x27;&lt;/div&gt;&#x27;+(form===&#x27;invoice&#x27;?invoiceForm():form===&#x27;payment&#x27;?paymentForm():&#x27;&#x27;)+(state.tab===&#x27;payments&#x27;?&#x27;&lt;section class=&quot;pn-panel&quot;&gt;&lt;div class=&quot;pn-row&quot;&gt;&lt;h2&gt;20 شجرة زيتون · &#x27;+money(200000)+&#x27;&lt;/h2&gt;&lt;span class=&quot;pn-good&quot;&gt;تم استلام 20 / 20&lt;/span&gt;&lt;/div&gt;&#x27;+milestones.map(m=&gt;{const posted=state.payments.filter(p=&gt;p.order===1&amp;&amp;p.milestone===m.id&amp;&amp;p.status===&#x27;posted&#x27;).reduce((n,p)=&gt;n+p.amount,0);return &#x27;&lt;div class=&quot;pn-row pn-log&quot;&gt;&lt;div&gt;&#x27;+m.name+&#x27;&lt;small class=&quot;pn-muted&quot; style=&quot;display:block&quot;&gt;&#x27;+money(m.amount)+&#x27; · المدفوع &#x27;+money(posted)+&#x27;&lt;/small&gt;&lt;/div&gt;&#x27;+(posted&gt;=m.amount?status(&#x27;posted&#x27;):m.eligible?&#x27;&lt;span class=&quot;pn-status pn-good&quot;&gt;شرط الدفع متحقق&lt;/span&gt;&#x27;:btn(&#x27;إثبات اكتمال الزراعة&#x27;,&#x27;planting&#x27;))+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/section&gt;&lt;section class=&quot;pn-panel&quot;&gt;&lt;h2&gt;طلبات الدفع&lt;/h2&gt;&lt;div class=&quot;pn-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;المرجع&lt;/th&gt;&lt;th&gt;المبلغ&lt;/th&gt;&lt;th&gt;الحالة&lt;/th&gt;&lt;th&gt;الإجراء&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&l
